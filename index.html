<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 stops iOS auto-zooming when an input with font-size
         <16px gets focus — in the installed (standalone) app that zoom never
         reverts on its own, leaving the page "escaped" beyond the window until
         the user pinches out (owner report 2026-07-31, Find search). Manual
         pinch-zoom still works: iOS ≥10 ignores the cap for user gestures, so
         accessibility zoom is preserved. Belt-and-braces with the ≥16px input
         rule in index.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>HeatPump DB — Heat Pump Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- No-JS fallback. Honest content for a visitor without JavaScript, and a
         real crawl path to the public pages (the app itself renders client-side,
         so without this the only discovery route is sitemap.xml). Never hidden
         from users: <noscript> shows exactly when the app cannot. -->
    <noscript>
      <div style="max-width:640px;margin:48px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;color:#1d1d1f">
        <h1 style="font-size:22px">HeatPump DB</h1>
        <p>This heat pump database needs JavaScript. These pages work without it:</p>
        <ul>
          <li><a href="/guide/">Heat pump funding guide</a></li>
          <li><a href="/news/">Heat pump market news</a></li>
          <li><a href="/pricing">Plans &amp; pricing</a></li>
          <li><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Use</a> · <a href="/imprint">Legal Notice</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
