Poland 2025", "url": "https://spiug.pl/app/uploads/2026/08/Report_Market_of_heating_appliances_in_Poland_2025.pdf"}, {"label": "PORT PC — 2025 market & 2026 outlook", "url": "https://portpc.pl/w-2025-roku-polacy-kupili-niemal-tyle-samo-pomp-ciepla-co-w-2024-%E2%88%92-wiekszosc-bez-dotacji/"}, {"label": "PORT PC — H1 2026 market update (06.08.2026)", "url": "https://informacjeprasowe.pl/sprzedaz-pomp-ciepla-do-ogrzewania-budynkow-wzrosla-o-18-proc-w-i-polroczu-2026-r/"}]}, {"id": "it-market", "type": "it_market", "title_key": "it1", "body_key": "it1_body", "accent": "#008C45", "sources": [{"label": "Assotermica — 2025 market release", "url": "https://www.anima.it/associazioni/elenco/assotermica/media/comunicati-stampa/caldaie-mercato-in-forte-contrazione-nel-2025-segnali-di-allarme-per-il-comparto.kl"}, {"label": "EHPA — 2026 European market data", "url": "https://ehpa.org/market-data/"}]}, {"id": "patterns", "type": "patterns", "title_key": "patterns", "body_key": "patterns_body", "accent": "#35C6A2", "sources": []}, {"id": "watch", "type": "watch", "title_key": "watch", "body_key": "watch_body", "accent": "#35C6A2", "sources": [{"label": "BDH — Heizungsmarkt H1 2026", "url": "https://www.bdh-industrie.de/presse/pressemeldungen/artikel/heizungsmarkt-legt-zu-waermepumpen-setzen-positive-impulse"}, {"label": "DESNZ — Boiler Upgrade Scheme 2026–2030", "url": "https://www.gov.uk/government/publications/boiler-upgrade-scheme-bus-extension-summary-business-case"}, {"label": "PORT PC — 2025 market & 2026 outlook", "url": "https://portpc.pl/w-2025-roku-polacy-kupili-niemal-tyle-samo-pomp-ciepla-co-w-2024-%E2%88%92-wiekszosc-bez-dotacji/"}, {"label": "EHPA — 2026 European market data", "url": "https://ehpa.org/market-data/"}]}, {"id": "method", "type": "method", "title_key": "method", "body_key": "method_body", "accent": "#35C6A2", "sources": [{"label": "BDH — Absatz Heizungen 2025", "url": "https://www.bdh-industrie.de/fileadmin/user_upload/Downloads/PresseMeldungen/Absatzzahlen_Heizungen_Deutschland_2025.pdf"}, {"label": "EHI — Heating Market Report 2025", "url": "https://ehi.eu/wp-content/uploads/2026/06/EHI_Annual-Report-2025_18.06.26_Digital.pdf"}, {"label": "Uniclima — Bilan 2025", "url": "https://www.uniclima.fr/userfiles/2026/DP_Uniclima_Bilan_2025_VF.pdf"}, {"label": "SPIUG — Heating equipment market in Poland 2025", "url": "https://spiug.pl/app/uploads/2026/08/Report_Market_of_heating_appliances_in_Poland_2025.pdf"}, {"label": "Assotermica — 2025 market release", "url": "https://www.anima.it/associazioni/elenco/assotermica/media/comunicati-stampa/caldaie-mercato-in-forte-contrazione-nel-2025-segnali-di-allarme-per-il-comparto.kl"}, {"label": "EHPA — 2026 European market data", "url": "https://ehpa.org/market-data/"}]}];
const I18N={"en": {"lang": "English", "special": "SPECIAL REPORT · AUGUST 2026", "title": "Europe’s Heating Transition: Five Markets, Five Realities", "subtitle": "Germany · United Kingdom · France · Poland · Italy — 2025 full year + latest 2026 market signals through August", "read": "How to read this report", "read_body": "This report separates appliance sales from installations and keeps each national counting basis intact. A heat-pump “share” is only meaningful inside its own scope. Germany excludes air-to-air and DHW units; Poland includes both; France publishes air-to-air separately; the UK has multiple valid sales and installation series; Italy does not publish a defensible market share.", "rule1": "Sales ≠ installations", "rule2": "Scope before ranking", "rule3": "Primary evidence first", "exec": "Executive Summary", "exec_body": "Europe’s transition is structural, but the 2025 market is not one uniform story. Germany reached a turning point, the UK grew from a low base, France’s hydronic market kept shrinking, Poland was distorted by inventory and definition changes, and Italy showed a sharp boiler contraction alongside stronger air-to-air activity. The most important conclusion is not a league table: it is that market direction, policy design and data definitions must be read together.", "eu_title": "Europe rebounded in 2025 — but the base changed", "eu_body": "EHPA reports 2.9 million heat pumps sold across 21 European countries in 2025, up 13%, after 2.31 million across 19 countries in 2024, down 22%. The comparison is directionally useful but not like-for-like because the country set expanded. The installed stock reached 29.3 million.", "dash": "Five-market dashboard — 2025", "scope": "Why the percentages are not rankings", "scope_body": "A “heat pump share” can move dramatically simply because the denominator changes. The table below shows why a single cross-country share chart would create false precision.", "de1": "Germany — the market reset became a technology turning point", "de1_body": "The total market fell from the extraordinary 2023 pull-forward peak to 627,000 units in 2025, the lowest level in 15 years. Yet heat pumps rebounded 55% to 299,000 and became the largest heating technology category. H1 2026 strengthened that signal: 194,500 heat pumps were sold, +40% year on year.", "de2": "Germany — 2026 is already testing the forecast range", "de2_body": "BWP’s March 2026 BAU scenario assumed 332,500 heat pumps for full-year 2026. By June, 194,500 units had already been sold. That does not make the ambitious scenario automatic: funding stability, electricity-to-fossil price ratios and consumer confidence still determine whether H1 momentum survives into winter.", "uk1": "United Kingdom — boiler scale remains huge, heat-pump growth is real", "uk1_body": "Hydronic heat-pump sales rose from 47,699 in 2021 to 110,353 in 2025, while gas and oil boiler sales fell from 1.89 million to 1.45 million. The transition is visible, but the 2025 hydronic heat-pump share of boilers + heat pumps was still only 7.1%.", "uk2": "United Kingdom — five valid numbers describe five different things", "uk2_body": "2025 can be described as 125,037 heat-pump sales, 110,353 hydronic sales, 61,246 MCS-certified installations, 53,265 official retrofit domestic installations, or 31,308 BUS grants paid. None is “wrong”; they answer different questions. Policy ambition is much larger: the Warm Homes Plan targets more than 450,000 installations per year by 2030.", "fr1": "France — the denominator is shrinking faster than heat pumps are growing", "fr1_body": "The hydronic heating market derived from Uniclima components fell from about 1.02 million units in 2021 to 613,460 in 2025. Air/water heat pumps were nearly flat in 2025 at 179,377 after a steep 2024 correction. The hydronic heat-pump share rose slightly to 29.6%, but that is mainly a denominator story, not a new volume boom.", "fr2": "France — 2026 adds a new air-to-air signal", "fr2_body": "Uniclima recorded 803,661 sub-17.5 kW air-to-air outdoor units in 2025. The latest 2026 hard number is nearly 355,000 air-to-air units sold by manufacturers to distributors from January to April 2026. No comparable H1 2026 air/water volume has been published by Uniclima as of mid-August, so the hydronic trend remains anchored to the 2025 full-year series.", "pl1": "Poland — broad heat-pump volume recovered, but the definition changed", "pl1_body": "SPIUG’s broad heat-pump series, including air-to-air and DHW units, reached 178,610 in 2025. The same report shows heat pumps at 32.1% of heating-appliance sales. But SPIUG changed the heat-pump definition between report vintages, so the 2024–2025 share sequence must not be read as a clean time series.", "pl2": "Poland — inventory explains more than the headline", "pl2_body": "PORT PC estimates around 80,000 air-to-water units reached end users in 2025, but about 19,000 came from old inventory. New sell-in for central-heating air-to-water units was about 61,000, versus nearly 70,000 in 2024. Only about one in five heat pumps sold in 2025 received support from Moje Ciepło or Czyste Powietrze.", "it1": "Italy — do not manufacture a market share that no source publishes", "it1_body": "Assotermica reports wall-hung boiler sales down 15.7% to 769,090 in 2025. EHPA reports 423,000 heat pumps on its broad basis including air-to-air. Those figures use different scopes and cannot be divided into a valid “heat-pump share”. Assoclima’s 2025 survey instead shows residential hydronic weakness and strong air-to-air growth.", "patterns": "What the five markets say together", "patterns_body": "The common direction is away from fossil-only heating, but the path is volatile. 2023 pull-forward effects, 2024 destocking, incentive redesign and energy-price expectations all matter. A rising share can coexist with falling heat-pump volume, and a record sales headline can coexist with weak certified installations. Professionals need source-specific intelligence, not one European percentage.", "watch": "What to watch in H2 2026 and 2027", "watch_body": "Watch four variables: subsidy continuity, electricity-to-gas price ratios, retrofit policy clarity and the gap between sell-in and actual installations. Germany’s H1 momentum, the UK’s delivery gap to 2030, France’s hydronic recovery, Poland’s inventory normalization and Italy’s post-incentive mix will determine whether 2025 was a durable transition year or another volatile reset.", "method": "Methodology & source discipline", "method_body": "Every number in this report is tied to a named publishing body and a defined basis. We do not interpolate missing unit data, and we do not convert sales into installations. Derived totals and shares are labelled as derived. Where public sources cannot support a figure — especially Italy’s total heating market and heat-pump share — the gap is shown rather than filled.", "cta": "Explore the full country databases and download the latest market report", "locked_title": "The rest of this report is available on HeatPump DataBase Europe", "locked_body": "Download the Full Edition from your country site. The Full Edition contains all country chapters, interactive charts, source links, methodology notes and H2 2026 watchpoints.", "sources": "Sources", "next": "Next", "prev": "Previous", "full": "Full Edition", "preview": "Preview Edition", "capture": "Every chart includes HeatPump DB Europe branding and source attribution for professional reuse.", "imp1": "Installer", "imp2": "Manufacturer / Distributor", "imp3": "Designer / Consultant", "imp1t": "Expect more mixed-technology customer questions. Source traceability and subsidy status are becoming part of the sales workflow.", "imp2t": "Channel inventory can distort demand signals. Separate sell-in, sell-out and certified installations before planning stock or campaigns.", "imp3t": "National definitions and policy rules diverge. Cross-country comparison must begin with scope, not with headline share."}, "de": {"lang": "Deutsch", "special": "SONDERBERICHT · AUGUST 2026", "title": "Europas Wärmewende: Fünf Märkte, fünf Realitäten", "subtitle": "Deutschland · Vereinigtes Königreich · Frankreich · Polen · Italien — Gesamtjahr 2025 + neueste Marktsignale 2026 bis August", "read": "So lesen Sie diesen Bericht", "read_body": "Dieser Bericht trennt Geräteabsatz von Installationen und erhält die jeweilige nationale Zählbasis. Ein Wärmepumpen-„Anteil“ ist nur innerhalb seines definierten Umfangs sinnvoll. Deutschland schließt Luft/Luft- und Trinkwasser-Wärmepumpen aus; Polen schließt beide ein; Frankreich weist Luft/Luft separat aus; im Vereinigten Königreich existieren mehrere gültige Absatz- und Installationsreihen; Italien veröffentlicht keinen belastbaren Marktanteil.", "rule1": "Absatz ≠ Installation", "rule2": "Umfang vor Ranking", "rule3": "Primärquellen zuerst", "exec": "Executive Summary", "exec_body": "Die Wärmewende in Europa ist strukturell, aber 2025 erzählt nicht eine einzige Marktgeschichte. Deutschland erreichte einen Wendepunkt, das Vereinigte Königreich wächst von niedriger Basis, Frankreichs wassergeführter Markt schrumpft weiter, Polen wird durch Lagerbestände und Definitionswechsel verzerrt, und Italien zeigt einen starken Kesseleinbruch bei gleichzeitig dynamischerem Luft/Luft-Geschäft. Entscheidend ist daher nicht eine Rangliste, sondern das Zusammenspiel von Marktrichtung, Politik und Datenbasis.", "eu_title": "Europa erholte sich 2025 — aber die Vergleichsbasis änderte sich", "eu_body": "EHPA meldet 2,9 Mio. verkaufte Wärmepumpen in 21 europäischen Ländern 2025, +13%, nach 2,31 Mio. in 19 Ländern 2024, −22%. Die Richtung ist aussagekräftig, der Vergleich aber nicht vollständig like-for-like, weil mehr Länder enthalten sind. Der Bestand erreichte 29,3 Mio.", "dash": "Fünf-Märkte-Dashboard — 2025", "scope": "Warum Prozentwerte kein Ranking sind", "scope_body": "Ein Wärmepumpenanteil kann sich stark verändern, nur weil sich der Nenner ändert. Die Tabelle zeigt, warum ein einziges Länder-Ranking falsche Genauigkeit erzeugen würde.", "de1": "Deutschland — aus dem Marktreset wurde ein Technologiewendepunkt", "de1_body": "Der Gesamtmarkt fiel vom außergewöhnlichen Vorzieheffekt 2023 auf 627.000 Geräte im Jahr 2025, den niedrigsten Stand seit 15 Jahren. Wärmepumpen stiegen jedoch um 55% auf 299.000 und wurden zur größten Heiztechnik-Kategorie. Im 1. Halbjahr 2026 verstärkte sich das Signal: 194.500 Wärmepumpen, +40% zum Vorjahr.", "de2": "Deutschland — 2026 testet bereits die Prognosespanne", "de2_body": "Das BAU-Szenario des BWP vom März 2026 unterstellte 332.500 Wärmepumpen für das Gesamtjahr 2026. Bis Juni waren bereits 194.500 Geräte verkauft. Das macht das ZIEL-Szenario nicht automatisch: Förderstabilität, Strom-/Gaspreisverhältnis und Verbrauchervertrauen entscheiden, ob das H1-Momentum bis zum Winter hält.", "uk1": "Vereinigtes Königreich — Kessel bleiben riesig, Wärmepumpen wachsen real", "uk1_body": "Der Absatz wassergeführter Wärmepumpen stieg von 47.699 im Jahr 2021 auf 110.353 im Jahr 2025, während Gas- und Ölkessel von 1,89 Mio. auf 1,45 Mio. zurückgingen. Die Transformation ist sichtbar, doch der Anteil wassergeführter Wärmepumpen an Kesseln + Wärmepumpen lag 2025 erst bei 7,1%.", "uk2": "Vereinigtes Königreich — fünf richtige Zahlen beantworten fünf Fragen", "uk2_body": "2025 lässt sich mit 125.037 Wärmepumpen-Verkäufen, 110.353 wassergeführten Verkäufen, 61.246 MCS-zertifizierten Installationen, 53.265 offiziellen Retrofit-Installationen oder 31.308 BUS-Zuschüssen beschreiben. Keine Zahl ist falsch; sie misst etwas anderes. Das Warm Homes Plan-Ziel liegt bei über 450.000 Installationen pro Jahr bis 2030.", "fr1": "Frankreich — der Nenner schrumpft schneller als die Wärmepumpe wächst", "fr1_body": "Der aus Uniclima-Komponenten abgeleitete wassergeführte Heizungsmarkt sank von rund 1,02 Mio. Geräten 2021 auf 613.460 im Jahr 2025. Luft/Wasser-Wärmepumpen lagen 2025 nach dem starken Rückgang 2024 nahezu stabil bei 179.377. Der Anteil stieg leicht auf 29,6%, vor allem wegen des kleineren Gesamtmarkts.", "fr2": "Frankreich — 2026 liefert ein neues Luft/Luft-Signal", "fr2_body": "Uniclima meldete 803.661 Luft/Luft-Außengeräte unter 17,5 kW im Jahr 2025. Die aktuellste harte 2026er-Zahl sind knapp 355.000 Luft/Luft-Geräte, die von Januar bis April 2026 von Herstellern an Distributoren verkauft wurden. Für Luft/Wasser liegt bis Mitte August keine vergleichbare H1-2026-Stückzahl von Uniclima vor; deshalb bleibt die hydronische Trendanalyse auf dem Gesamtjahr 2025 verankert.", "pl1": "Polen — breiter Wärmepumpenabsatz erholt, Definition aber verändert", "pl1_body": "Die breite SPIUG-Reihe inklusive Luft/Luft und Trinkwasser-Wärmepumpen erreichte 178.610 Geräte 2025. Im selben Bericht kommen Wärmepumpen auf 32,1% des Heizgeräteabsatzes. Da SPIUG jedoch die Wärmepumpendefinition zwischen Berichtsversionen änderte, ist die Folge 2024–2025 kein sauberer Zeitvergleich.", "pl2": "Polen — Lagerbestände erklären mehr als die Schlagzeile", "pl2_body": "PORT PC schätzt, dass 2025 rund 80.000 Luft/Wasser-Geräte Endkunden erreichten, davon etwa 19.000 aus alten Lagerbeständen. Der neue Sell-in für Luft/Wasser-Zentralheizung lag bei rund 61.000 gegenüber knapp 70.000 in 2024. Nur etwa jede fünfte 2025 verkaufte Wärmepumpe wurde über Moje Ciepło oder Czyste Powietrze gefördert.", "it1": "Italien — keinen Marktanteil erfinden, den keine Quelle veröffentlicht", "it1_body": "Assotermica meldet 2025 einen Rückgang wandhängender Kessel um 15,7% auf 769.090. EHPA meldet 423.000 Wärmepumpen auf breiter Basis inklusive Luft/Luft. Beide Zahlen haben unterschiedliche Umfänge und dürfen nicht zu einem „Wärmepumpenanteil“ dividiert werden. Assoclima zeigt zugleich Schwäche im kleinen wassergeführten Wohnsegment und starkes Luft/Luft-Wachstum.", "patterns": "Was die fünf Märkte gemeinsam zeigen", "patterns_body": "Die gemeinsame Richtung ist weg von rein fossiler Wärme, der Weg bleibt volatil. Vorzieheffekte 2023, Destocking 2024, Förderumbauten und Energiepreiserwartungen prägen die Daten. Ein steigender Anteil kann mit sinkendem Wärmepumpenabsatz zusammenfallen, und Rekordabsatz kann neben schwachen Installationszahlen stehen.", "watch": "Worauf in H2 2026 und 2027 zu achten ist", "watch_body": "Vier Variablen sind entscheidend: Förderkontinuität, Strom-zu-Gas-Preisverhältnis, Klarheit der Retrofit-Regeln und die Lücke zwischen Sell-in und realen Installationen. Deutschlands H1-Dynamik, die britische Zielerreichung, Frankreichs wassergeführte Erholung, Polens Lagerbereinigung und Italiens Mix nach Förderumbauten bestimmen den nächsten Zyklus.", "method": "Methodik & Quellen-Disziplin", "method_body": "Jede Zahl ist einer benannten Quelle und einer definierten Basis zugeordnet. Fehlende Stückzahlen werden nicht interpoliert und Absatz wird nicht in Installation umgedeutet. Abgeleitete Summen und Anteile sind als solche gekennzeichnet. Wo öffentliche Quellen keinen Wert tragen — besonders beim italienischen Gesamtmarkt und Wärmepumpenanteil — bleibt die Lücke sichtbar.", "cta": "Länderdatenbanken öffnen und den neuesten Marktbericht herunterladen", "locked_title": "Der restliche Bericht ist über HeatPump DataBase Europe verfügbar", "locked_body": "Laden Sie die Full Edition auf Ihrer Länderseite herunter. Sie enthält alle Länder-Kapitel, interaktive Grafiken, Quellenlinks, Methodik und Beobachtungspunkte für H2 2026.", "sources": "Quellen", "next": "Weiter", "prev": "Zurück", "full": "Full Edition", "preview": "Preview Edition", "capture": "Jede Grafik enthält HeatPump DB Europe Branding und Quellenhinweis für die professionelle Weiterverwendung.", "imp1": "Installateur", "imp2": "Hersteller / Großhandel", "imp3": "Planer / Berater", "imp1t": "Mehr Kundenfragen zu gemischten Technologien sind zu erwarten. Quellen- und Förderstatus werden Teil des Verkaufsprozesses.", "imp2t": "Lagerbestände verzerren Nachfragesignale. Sell-in, Sell-out und zertifizierte Installationen getrennt auswerten.", "imp3t": "Nationale Definitionen und Förderregeln driften auseinander. Länderanalysen müssen mit dem Umfang beginnen, nicht mit dem Schlagzeilen-Anteil."}, "fr": {"lang": "Français", "special": "RAPPORT SPÉCIAL · AOÛT 2026", "title": "Transition du chauffage en Europe : cinq marchés, cinq réalités", "subtitle": "Allemagne · Royaume-Uni · France · Pologne · Italie — année 2025 + derniers signaux de marché 2026 jusqu’en août", "read": "Comment lire ce rapport", "read_body": "Ce rapport distingue les ventes d’équipements des installations et conserve la base de comptage propre à chaque pays. Une « part » de pompe à chaleur n’a de sens qu’à l’intérieur de son périmètre. L’Allemagne exclut l’air/air et les PAC ECS ; la Pologne les inclut ; la France publie l’air/air séparément ; le Royaume-Uni dispose de plusieurs séries valides de ventes et d’installations ; l’Italie ne publie pas de part de marché défendable.", "rule1": "Ventes ≠ installations", "rule2": "Le périmètre avant le classement", "rule3": "Priorité aux sources primaires", "exec": "Résumé exécutif", "exec_body": "La transition européenne est structurelle, mais 2025 ne raconte pas une histoire unique. L’Allemagne atteint un point d’inflexion, le Royaume-Uni progresse depuis une base faible, le marché hydraulique français continue de se contracter, la Pologne est perturbée par les stocks et les changements de définition, et l’Italie combine forte baisse des chaudières et hausse de l’air/air. La conclusion clé n’est pas un palmarès : il faut lire ensemble direction du marché, politiques publiques et définitions statistiques.", "eu_title": "L’Europe a rebondi en 2025 — mais la base a changé", "eu_body": "L’EHPA indique 2,9 millions de PAC vendues dans 21 pays européens en 2025, +13%, après 2,31 millions dans 19 pays en 2024, −22%. Le signal est utile, mais la comparaison n’est pas strictement identique car le nombre de pays a augmenté. Le parc installé atteint 29,3 millions.", "dash": "Tableau de bord des cinq marchés — 2025", "scope": "Pourquoi les pourcentages ne sont pas un classement", "scope_body": "Une part de PAC peut fortement varier simplement parce que le dénominateur change. Le tableau montre pourquoi un classement unique entre pays créerait une fausse précision.", "de1": "Allemagne — le reset du marché devient un tournant technologique", "de1_body": "Le marché total est retombé du pic exceptionnel de 2023 à 627 000 unités en 2025, son plus bas niveau depuis 15 ans. Pourtant, les PAC ont rebondi de 55% à 299 000 et sont devenues la première catégorie. Au S1 2026, 194 500 PAC ont été vendues, +40% sur un an.", "de2": "Allemagne — 2026 teste déjà la fourchette des scénarios", "de2_body": "Le scénario BAU du BWP publié en mars 2026 prévoyait 332 500 PAC sur l’année. À fin juin, 194 500 unités avaient déjà été vendues. Cela ne rend pas automatique le scénario ambitieux : stabilité des aides, rapport prix électricité/gaz et confiance des ménages restent déterminants.", "uk1": "Royaume-Uni — l’échelle des chaudières reste immense, la croissance PAC est réelle", "uk1_body": "Les ventes de PAC hydrauliques passent de 47 699 en 2021 à 110 353 en 2025, tandis que les chaudières gaz et fioul reculent de 1,89 million à 1,45 million. La transition est visible, mais la part hydronique dans chaudières + PAC n’était encore que de 7,1% en 2025.", "uk2": "Royaume-Uni — cinq chiffres justes pour cinq questions différentes", "uk2_body": "2025 peut être décrit par 125 037 ventes de PAC, 110 353 ventes hydrauliques, 61 246 installations certifiées MCS, 53 265 installations domestiques de rénovation ou 31 308 aides BUS payées. Aucun chiffre n’est faux : ils mesurent des réalités différentes. Le Warm Homes Plan vise plus de 450 000 installations par an en 2030.", "fr1": "France — le dénominateur baisse plus vite que les PAC ne progressent", "fr1_body": "Le marché hydraulique dérivé des composantes Uniclima est passé d’environ 1,02 million d’unités en 2021 à 613 460 en 2025. Les PAC air/eau sont restées presque stables en 2025 à 179 377 après la forte correction de 2024. La part hydraulique atteint 29,6%, surtout grâce à la contraction du marché total.", "fr2": "France — 2026 apporte un nouveau signal sur l’air/air", "fr2_body": "Uniclima a recensé 803 661 unités extérieures air/air de moins de 17,5 kW en 2025. Le chiffre dur le plus récent pour 2026 est près de 355 000 unités air/air vendues par les industriels aux distributeurs de janvier à avril. Aucun volume comparable S1 2026 air/eau n’est publié par Uniclima à mi-août; l’analyse hydronique reste donc ancrée sur l’année 2025.", "pl1": "Pologne — reprise du volume large, mais changement de définition", "pl1_body": "La série large de SPIUG, incluant air/air et PAC ECS, atteint 178 610 unités en 2025. Le même rapport attribue 32,1% des ventes d’appareils de chauffage aux PAC. Mais SPIUG a modifié la définition entre éditions : la séquence 2024–2025 n’est pas une série temporelle propre.", "pl2": "Pologne — les stocks expliquent davantage que le titre", "pl2_body": "PORT PC estime qu’environ 80 000 PAC air/eau ont atteint les utilisateurs finaux en 2025, dont environ 19 000 issues d’anciens stocks. Le sell-in neuf pour le chauffage central air/eau est d’environ 61 000, contre près de 70 000 en 2024. Environ une PAC sur cinq seulement a bénéficié de Moje Ciepło ou Czyste Powietrze.", "it1": "Italie — ne pas inventer une part de marché non publiée", "it1_body": "Assotermica indique une baisse de 15,7% des chaudières murales à 769 090 unités en 2025. L’EHPA rapporte 423 000 PAC sur une base large incluant l’air/air. Les périmètres diffèrent et ne permettent pas de calculer une part valide. Assoclima montre en parallèle un léger recul de l’hydronique résidentiel et une forte croissance de l’air/air.", "patterns": "Ce que les cinq marchés disent ensemble", "patterns_body": "La direction commune s’éloigne du chauffage exclusivement fossile, mais la trajectoire reste volatile. Effets d’anticipation 2023, déstockage 2024, réformes des aides et attentes sur les prix de l’énergie dominent les données. Une part en hausse peut coexister avec des volumes PAC en baisse, et un record de ventes avec des installations faibles.", "watch": "À surveiller au S2 2026 et en 2027", "watch_body": "Quatre variables : continuité des aides, rapport prix électricité/gaz, clarté des règles de rénovation et écart entre sell-in et installations réelles. L’élan allemand, le déficit britannique face à 2030, la reprise hydraulique française, la normalisation des stocks polonais et le mix italien après réforme des incitations détermineront le prochain cycle.", "method": "Méthodologie & discipline des sources", "method_body": "Chaque chiffre est rattaché à un organisme et à un périmètre précis. Nous n’interpolons pas les volumes manquants et nous ne transformons pas des ventes en installations. Les totaux et parts dérivés sont signalés. Lorsque les sources publiques ne permettent pas un chiffre — notamment pour le total et la part PAC en Italie — la lacune reste visible.", "cta": "Explorer les bases nationales et télécharger le dernier rapport marché", "locked_title": "La suite du rapport est disponible sur HeatPump DataBase Europe", "locked_body": "Téléchargez l’édition complète depuis votre site national. Elle contient tous les chapitres pays, graphiques interactifs, liens sources, méthodologie et points de vigilance S2 2026.", "sources": "Sources", "next": "Suivant", "prev": "Précédent", "full": "Édition complète", "preview": "Édition aperçu", "capture": "Chaque graphique inclut la marque HeatPump DB Europe et l’attribution de source pour la réutilisation professionnelle.", "imp1": "Installateur", "imp2": "Fabricant / Distributeur", "imp3": "Concepteur / Consultant", "imp1t": "Les questions clients sur les technologies mixtes vont augmenter. Traçabilité des sources et statut des aides entrent dans le processus de vente.", "imp2t": "Les stocks de canal peuvent fausser la demande. Distinguer sell-in, sell-out et installations certifiées avant de planifier stocks ou campagnes.", "imp3t": "Définitions nationales et règles d’aide divergent. Toute comparaison pays doit commencer par le périmètre, pas par la part affichée."}, "pl": {"lang": "Polski", "special": "RAPORT SPECJALNY · SIERPIEŃ 2026", "title": "Transformacja ogrzewania w Europie: pięć rynków, pięć rzeczywistości", "subtitle": "Niemcy · Wielka Brytania · Francja · Polska · Włochy — pełny 2025 + najnowsze sygnały rynkowe 2026 do sierpnia", "read": "Jak czytać ten raport", "read_body": "Raport rozdziela sprzedaż urządzeń od instalacji i zachowuje krajowe definicje. „Udział” pomp ciepła ma sens tylko w ramach danego zakresu. Niemcy wykluczają air-to-air i pompy CWU; Polska je uwzględnia; Francja publikuje air-to-air osobno; Wielka Brytania ma kilka poprawnych serii sprzedaży i instalacji; Włochy nie publikują obronnego udziału rynkowego.", "rule1": "Sprzedaż ≠ instalacje", "rule2": "Zakres przed rankingiem", "rule3": "Najpierw źródła pierwotne", "exec": "Streszczenie wykonawcze", "exec_body": "Europejska transformacja ma charakter strukturalny, ale rok 2025 nie tworzy jednej historii. Niemcy osiągnęły punkt zwrotny, Wielka Brytania rośnie z niskiej bazy, francuski rynek wodny nadal się kurczy, Polska jest zniekształcona przez zapasy i zmianę definicji, a Włochy łączą mocny spadek kotłów z wzrostem air-to-air. Najważniejszy wniosek to nie ranking, lecz wspólne czytanie kierunku rynku, polityki i definicji danych.", "eu_title": "Europa odbiła w 2025 r. — ale zmieniła się baza", "eu_body": "EHPA podaje 2,9 mln pomp ciepła sprzedanych w 21 krajach europejskich w 2025 r., +13%, po 2,31 mln w 19 krajach w 2024 r., −22%. Kierunek jest istotny, ale porównanie nie jest idealnie porównywalne, ponieważ wzrosła liczba krajów. Łączny zasób osiągnął 29,3 mln.", "dash": "Panel pięciu rynków — 2025", "scope": "Dlaczego procenty nie są rankingiem", "scope_body": "Udział pomp ciepła może silnie się zmienić tylko dlatego, że zmienia się mianownik. Tabela pokazuje, dlaczego jeden ranking krajów dawałby fałszywą precyzję.", "de1": "Niemcy — reset rynku stał się punktem zwrotnym technologii", "de1_body": "Cały rynek spadł z wyjątkowego szczytu 2023 do 627 tys. urządzeń w 2025 r., najniżej od 15 lat. Pompy ciepła odbiły jednak o 55% do 299 tys. i stały się największą kategorią. W I poł. 2026 sprzedano 194,5 tys. pomp, +40% r/r.", "de2": "Niemcy — 2026 już testuje zakres prognoz", "de2_body": "Scenariusz BAU BWP z marca 2026 zakładał 332,5 tys. pomp ciepła w całym 2026 r. Do końca czerwca sprzedano już 194,5 tys. Nie oznacza to automatycznie scenariusza ambitnego: stabilność wsparcia, relacja cen energii i zaufanie klientów zdecydują o utrzymaniu tempa.", "uk1": "Wielka Brytania — skala kotłów pozostaje ogromna, wzrost pomp jest realny", "uk1_body": "Sprzedaż wodnych pomp ciepła wzrosła z 47 699 w 2021 r. do 110 353 w 2025 r., a sprzedaż kotłów gazowych i olejowych spadła z 1,89 mln do 1,45 mln. Transformacja jest widoczna, lecz udział wodnych pomp w kotłach + pompach wynosił w 2025 r. tylko 7,1%.", "uk2": "Wielka Brytania — pięć poprawnych liczb opisuje pięć różnych zjawisk", "uk2_body": "Rok 2025 można opisać jako 125 037 sprzedaży pomp, 110 353 sprzedaży wodnych, 61 246 instalacji MCS, 53 265 oficjalnych instalacji retrofit lub 31 308 wypłaconych dotacji BUS. Żadna liczba nie jest błędna — odpowiada na inne pytanie. Warm Homes Plan celuje w ponad 450 tys. instalacji rocznie do 2030 r.", "fr1": "Francja — mianownik kurczy się szybciej niż rosną pompy", "fr1_body": "Rynek wodny wyliczony z komponentów Uniclima spadł z ok. 1,02 mln urządzeń w 2021 r. do 613 460 w 2025 r. Pompy air/water były w 2025 r. niemal płaskie: 179 377 po silnej korekcie w 2024. Udział wzrósł do 29,6%, głównie z powodu mniejszego rynku całkowitego.", "fr2": "Francja — 2026 przynosi nowy sygnał dla air-to-air", "fr2_body": "Uniclima odnotowała 803 661 zewnętrznych jednostek air-to-air poniżej 17,5 kW w 2025 r. Najnowszą twardą liczbą z 2026 r. jest prawie 355 000 urządzeń air-to-air sprzedanych przez producentów do dystrybutorów od stycznia do kwietnia. Do połowy sierpnia Uniclima nie opublikowała porównywalnego wolumenu H1 2026 dla air/water, dlatego analiza hydroniczna pozostaje oparta na pełnym 2025 r.", "pl1": "Polska — szeroki wolumen wzrósł, ale zmieniła się definicja", "pl1_body": "Szeroka seria SPIUG obejmująca air-to-air i pompy CWU osiągnęła 178 610 sztuk w 2025 r. Ten sam raport pokazuje 32,1% udziału pomp w sprzedaży urządzeń grzewczych. SPIUG zmienił jednak definicję między edycjami raportu, dlatego sekwencja 2024–2025 nie jest czystą serią czasową.", "pl2": "Polska — zapasy wyjaśniają więcej niż nagłówek", "pl2_body": "PORT PC szacuje, że ok. 80 tys. pomp air/water trafiło do użytkowników końcowych w 2025 r., ale ok. 19 tys. pochodziło ze starych zapasów. Nowy sell-in pomp air/water do CO wyniósł ok. 61 tys. wobec prawie 70 tys. w 2024 r. Tylko około co piąta pompa sprzedana w 2025 r. otrzymała wsparcie Moje Ciepło lub Czyste Powietrze.", "it1": "Włochy — nie twórz udziału, którego nie publikuje żadne źródło", "it1_body": "Assotermica podaje spadek sprzedaży kotłów wiszących o 15,7% do 769 090 w 2025 r. EHPA podaje 423 tys. pomp ciepła na szerokiej bazie wraz z air-to-air. Zakresy są różne i nie wolno dzielić tych liczb w celu stworzenia udziału. Assoclima pokazuje jednocześnie słabość małych systemów wodnych i silny wzrost air-to-air.", "patterns": "Co łącznie mówią pięć rynków", "patterns_body": "Wspólny kierunek odchodzi od ogrzewania wyłącznie kopalnego, ale ścieżka jest zmienna. Efekty wyprzedzające 2023, destocking 2024, zmiany dotacji i oczekiwania cen energii mocno wpływają na dane. Rosnący udział może współistnieć ze spadkiem wolumenu pomp, a rekord sprzedaży ze słabymi instalacjami.", "watch": "Na co patrzeć w II poł. 2026 i w 2027", "watch_body": "Cztery zmienne: ciągłość wsparcia, relacja cen prądu i gazu, jasność polityki retrofit oraz luka między sell-in i rzeczywistymi instalacjami. Dynamika Niemiec, luka Wielkiej Brytanii do celu 2030, odbicie wodne Francji, normalizacja zapasów w Polsce i mix włoski po zmianach zachęt określą kolejny cykl.", "method": "Metodyka i dyscyplina źródeł", "method_body": "Każda liczba ma wskazaną instytucję i zakres. Nie interpolujemy brakujących wolumenów i nie zamieniamy sprzedaży na instalacje. Wyliczone sumy i udziały są oznaczone jako pochodne. Gdy źródła publiczne nie wspierają liczby — szczególnie całego rynku i udziału pomp we Włoszech — luka pozostaje jawna.", "cta": "Otwórz krajowe bazy i pobierz najnowszy raport rynkowy", "locked_title": "Pozostała część raportu jest dostępna w HeatPump DataBase Europe", "locked_body": "Pobierz pełną wersję z krajowej strony. Zawiera wszystkie rozdziały, interaktywne wykresy, linki do źródeł, metodykę i punkty obserwacji na II poł. 2026.", "sources": "Źródła", "next": "Dalej", "prev": "Wstecz", "full": "Pełna wersja", "preview": "Wersja podglądowa", "capture": "Każdy wykres zawiera markę HeatPump DB Europe i źródło, aby można go było profesjonalnie wykorzystać.", "imp1": "Instalator", "imp2": "Producent / Dystrybutor", "imp3": "Projektant / Konsultant", "imp1t": "Będzie więcej pytań klientów o mieszane technologie. Status źródła i dotacji staje się częścią procesu sprzedaży.", "imp2t": "Zapasy kanałowe mogą zniekształcać popyt. Przed planowaniem zapasów rozdziel sell-in, sell-out i certyfikowane instalacje.", "imp3t": "Krajowe definicje i zasady wsparcia się rozchodzą. Porównania należy zaczynać od zakresu, nie od nagłówkowego udziału."}, "it": {"lang": "Italiano", "special": "RAPPORTO SPECIALE · AGOSTO 2026", "title": "La transizione del riscaldamento in Europa: cinque mercati, cinque realtà", "subtitle": "Germania · Regno Unito · Francia · Polonia · Italia — 2025 completo + segnali di mercato 2026 aggiornati ad agosto", "read": "Come leggere questo rapporto", "read_body": "Il rapporto separa le vendite di apparecchi dalle installazioni e mantiene la base di conteggio nazionale. Una “quota” di pompe di calore ha senso solo nel proprio perimetro. La Germania esclude aria/aria e ACS; la Polonia le include; la Francia pubblica aria/aria separatamente; il Regno Unito ha più serie valide di vendite e installazioni; l’Italia non pubblica una quota di mercato difendibile.", "rule1": "Vendite ≠ installazioni", "rule2": "Prima il perimetro, poi il ranking", "rule3": "Prima le fonti primarie", "exec": "Executive Summary", "exec_body": "La transizione europea è strutturale, ma il 2025 non racconta una sola storia. La Germania raggiunge un punto di svolta, il Regno Unito cresce da una base bassa, il mercato idronico francese continua a ridursi, la Polonia è distorta da scorte e cambi di definizione, mentre l’Italia combina un forte calo delle caldaie con una dinamica positiva dell’aria/aria. La conclusione più importante non è una classifica: direzione del mercato, politiche e definizioni vanno lette insieme.", "eu_title": "L’Europa è rimbalzata nel 2025 — ma è cambiata la base", "eu_body": "EHPA indica 2,9 milioni di pompe di calore vendute in 21 paesi europei nel 2025, +13%, dopo 2,31 milioni in 19 paesi nel 2024, −22%. Il segnale è utile, ma il confronto non è perfettamente omogeneo perché il numero di paesi è aumentato. Lo stock installato ha raggiunto 29,3 milioni.", "dash": "Dashboard dei cinque mercati — 2025", "scope": "Perché le percentuali non sono una classifica", "scope_body": "La quota delle pompe di calore può cambiare molto semplicemente perché cambia il denominatore. La tabella mostra perché un unico ranking tra paesi produrrebbe falsa precisione.", "de1": "Germania — il reset del mercato diventa un punto di svolta tecnologico", "de1_body": "Il mercato totale è sceso dal picco eccezionale del 2023 a 627.000 unità nel 2025, minimo da 15 anni. Le pompe di calore sono però rimbalzate del 55% a 299.000, diventando la categoria princip function pageShell(p,idx,content,locked=false){let tx=I18N[lang];let title=tx[p.title_key]||p.title_key;let body=tx[p.body_key]||'';let cl=p.id==='cover'?'page cover':'page';cl+=' page-'+p.id;if(locked)cl+=' locked';if(p.id==='cover'){return `<section class="${cl}" style="--accent:${p.accent}" data-idx="${idx}"><div class="inner"><div class="body ${locked?'locked-content':''}">${content}</div></div>${locked?lockOverlay():''}</section>`}let code=p.id.startsWith('de')?'de':p.id.startsWith('uk')?'gb':p.id.startsWith('fr')?'fr':p.id.startsWith('pl')?'pl':p.id.startsWith('it')?'it':null;let icon=code?`<img class="headerCountryIcon" src="${ASSET[code]}" alt="">`:'';return `<section class="${cl}" style="--accent:${p.accent}" data-idx="${idx}"><div class="inner"><div class="pagehead"><div class="headwrap">${icon}<div><div class="kicker">${tx.special}</div><h1 class="title">${esc(title)}</h1>${body?`<p class="dek">${esc(body)}</p>`:''}</div></div><div class="pageno">${String(idx+1).padStart(2,'0')} / ${PAGES.length}</div></div><div class="body ${locked?'locked-content':''}">${content}</div>${brandFooter(p.sources)}</div>${locked?lockOverlay():''}</section>`}

case 'uk_market': return `<div class="grid2">${chartBox('ukBoiler','UK: gas + oil boiler sales, 2021–2025')}${chartBox('ukHp','UK: hydronic heat-pump sales, 2021–2025')}</div><div class="grid3 uk-summary">${metricCard('1.451m','2025 boilers','gas + oil')}${metricCard('110,353','2025 hydronic HP','factory-gate sales')}${metricCard('7.1%','Derived 2025 share','hydronic HP / (boilers + HP)')}</div>`;
case 'uk_policy': return `<div class="grid2 uk-policy-layout"><div class="card uk-policy-left"><span class="freshTag">Q1 2026 · HPA UK / DESNZ</span><h3>Sales and retrofit deployment are moving in different directions</h3><div class="grid2" style="margin-top:8px">${metricCard('+5%','Heating HP sales','Q1 2026 vs Q1 2025')}${metricCard('+17%','Total HP sales incl. DHW','Q1 2026 vs Q1 2025')}</div><div class="grid2" style="margin-top:8px">${metricCard('10,693','Official domestic retrofit installs','Q1 2026 · −22% YoY')}${metricCard('61%','Share of HP sales to new build','Q1 2026 · up from 55% in Q4 2025')}</div></div><div class="uk-policy-right"><div class="card"><h3>BUS and policy run-rate</h3><div class="metric">14,242</div><p class="sub">BUS grants paid in H1 2026 (England & Wales). By end-July 2026 Ofgem reported 90,115 vouchers redeemed cumulatively and £635.4m paid.</p></div><div class="card" style="margin-top:10px"><div class="metric">>450k/yr</div><h3>Warm Homes Plan ambition by 2030</h3><p class="sub">The latest 2026 data show why sales, new build and retrofit deployment must be separated: the market can grow while retrofit commissioning weakens.</p></div></div></div>`;
case 'fr_market': return `<div class="grid2 compact-chart">${chartBox('frBoiler','France: gas + oil boilers, 2021–2025')}${chartBox('frHp','France: hydronic heat pumps, 2021–2025')}</div><div class="fr-summary">${metricCard('613,460','2025 hydronic market','HeatPump DB calculation from Uniclima components')}${metricCard('181,890','2025 hydronic HP','air/water + geothermal')}${metricCard('29.6%','Derived hydronic HP share','not published by Uniclima')}</div>`;
case 'fr_air': return `<div class="grid2">${chartBox('frAir','France: air/air outdoor-unit sell-in, 2021–2025')}<div><div class="latest2026" style="grid-template-columns:1fr 1fr"><div class="card"><span class="freshTag">Jan–Apr 2026</span><div class="metric">~355k</div><h3>Air/air units sold to distributors</h3><p class="sub">Uniclima explicitly labels these as manufacturer-to-distributor sales, not installations.</p></div><div class="card"><span class="freshTag">2026 policy</span><div class="metric">5.5%</div><h3>Reduced VAT principle</h3><p class="sub">For high-performance reversible air/air units; Uniclima said in June that the technical eligibility decree was still awaited.</p></div></div><div class="callout" style="margin-top:14px">France’s latest 2026 hard market signal is therefore air/air, not hydronic air/water. Cooling demand and summer heat increasingly matter in the French heat-pump market and should be analysed separately from the hydronic heating denominator.</div></div></div>`;
case 'pl_market': return `<div class="grid2">${chartBox('plHp','Poland: broad heat-pump sales, 2014–2025')}<div><div class="grid2">${metricCard('178,610','2025 broad HP','includes air/air + DHW')}${metricCard('32.1%','2025 market share','SPIUG current vintage')}</div><div class="card scope-note-card"><h3>Scope of the chart</h3><p class="sub">SPIUG Figure 38 uses a broad heat-pump definition including air-to-air and domestic hot-water heat pumps. The chart preserves the newest SPIUG vintage as one consistent visual series.</p><div class="latest2026" style="grid-template-columns:1fr"><div class="card"><span class="freshTag">H1 2026 · PORT PC</span><span style="display:flex;align-items:baseline;gap:10px;margin-top:5px"><b style="font-size:30px;line-height:1;color:#173052">+18%</b><span class="sub" style="margin:0">heating HP sell-in · narrower heating-only basis</span></span></div></div></div></div></div>`;
case 'pl_channel': return `<div class="grid3">${metricCard('+18%','H1 2026 heating HP sell-in','PORT PC · YoY')}${metricCard('~32k','H1 air/water to wholesalers','plus ~4k ground-source')}${metricCard('+57%','H1 ground-source growth','Q2 alone +77%')}</div><div class="grid2"><div class="card"><span class="freshTag">06 Aug 2026</span><h3>Refined 2026 PORT PC outlook</h3><div class="metric">~71k</div><p class="sub">Air-to-water heating units for full-year 2026, plus ~9,900 ground-source and ~3,700 DHW-only units. PORT PC uses a narrower heating-focused scope than SPIUG.</p></div><div class="card"><h3>Inventory normalization is now visible</h3><p class="sub">About 80,000 air-to-water units reached end users in 2025; roughly 19,000 came from old stock and new sell-in was about 61,000. H1 2026 now shows renewed wholesale growth, with ground-source particularly strong.</p><div class="pillrow"><div class="pill"><span>2025 old inventory</span><b>~19k</b></div><div class="pill"><span>2025 new sell-in</span><b>~61k</b></div><div class="pill"><span>H1 2026 trend</span><b>+18%</b></div></div></div></div>`;
case 'it_market': return `<div class="grid2 it-market-layout"><div class="it-left-stack">${chartBox('itBoiler','Italy: wall-hung boilers — Assotermica',true)}${chartBox('itHp','Italy: broad heat pumps — EHPA basis',true)}</div><div><div class="latest2026" style="grid-template-columns:1fr 1fr"><div class="card"><span class="freshTag">H1 2026 · Assoclima</span><div class="metric">+25.5%</div><h3>Air/water HP volume</h3><p class="sub">Residential sizes strengthened: ≤10 kW +28.1%; 11–17 kW +24.1% by volume.</p></div><div class="card"><span class="freshTag">H1 2026</span><div class="metric">−0.6%</div><h3>Overall HVAC market value</h3><p class="sub">€1.79bn turnover; demand is shifting toward higher-efficiency system solutions.</p></div></div><div class="card scope-note-card"><h3>2025 reference points</h3><div class="pillrow"><div class="pill"><span>Wall-hung boilers</span><b>769,090</b></div><div class="pill"><span>Broad HP · EHPA</span><b>423k</b></div><div class="pill"><span>H1 2026 air/water</span><b>+25.5%</b></div></div><p class="sub">Separate indicators; the published product scopes are different.</p></div></div></div>`;
case 'patterns': return `<div class="grid2"><div class="card"><h3>1 · The denominator effect</h3><p class="sub">France shows how HP share can rise while absolute hydronic HP volume falls. Germany’s 2025 share jump also reflects a collapsing fossil denominator.</p></div><div class="card"><h3>2 · Pull-forward & destocking</h3><p class="sub">Germany 2023, Poland 2022 and Italian hybrid peaks show how policy deadlines and channel inventory can create apparent booms followed by abrupt corrections.</p></div><div class="card"><h3>3 · Subsidy design matters</h3><p class="sub">Germany shows heavy funding engagement; Poland’s 2025 sales were mostly unsubsidised; the UK is scaling a grant-led market.</p></div><div class="card"><h3>4 · Sales ≠ commissioning</h3><p class="sub">The UK makes the gap visible. A record manufacturer-sales year can coexist with much lower certified and official retrofit installation counts.</p></div></div>`;
case 'watch': return `<div class="grid3"><div class="card"><span class="badge"><span class="dot"></span>${tx.imp1}</span><p class="sub" style="margin-top:14px">${esc(tx.imp1t)}</p></div><div class="card"><span class="badge"><span class="dot"></span>${tx.imp2}</span><p class="sub" style="margin-top:14px">${esc(tx.imp2t)}</p></div><div class="card"><span class="badge"><span class="dot"></span>${tx.imp3}</span><p class="sub" style="margin-top:14px">${esc(tx.imp3t)}</p></div></div><div class="grid5">${watchCard('DE','H1 2026 momentum')}${watchCard('GB','Delivery gap to 2030')}${watchCard('FR','Hydronic recovery')}${watchCard('PL','Inventory normalization')}${watchCard('IT','Post-incentive mix')}</div>`;
case 'method': return `<div class="method-top"><div class="card"><h3>Evidence labels</h3><table class="table" style="margin-top:8px"><tbody><tr><td><b>PRIMARY</b></td><td>Publishing body’s own document / data</td></tr><tr><td><b>DERIVED</b></td><td>Arithmetic on published components</td></tr><tr><td><b>NOT FOUND</b></td><td>Not supported by public evidence</td></tr></tbody></table></div><div class="card"><h3>${tx.cta}</h3><p class="sub" style="margin:6px 0 11px">HeatPump DataBase Europe connects professional product data, market intelligence and source evidence across national markets.</p><a class="cta-main" href="https://www.heatpumpdb.eu" target="_blank">www.heatpumpdb.eu ↗</a><div class="countrylinks" style="justify-content:flex-start;margin-top:8px">${Object.values(MARKETS).map(m=>`<a href="${m.url}" target="_blank">${m.flag} ${m.name[lang]}</a>`).join('')}</div></div></div><div class="caution-register"><h3>Caution & interpretation register</h3><div class="caution-grid"><div class="caution-item"><div class="cp">Page 03</div><div>National shares use different bases and are not directly comparable.</div></div><div class="caution-item"><div class="cp">Page 04</div><div>EHPA country coverage changes across 2023–2025; bars are published headline totals, not a same-sample index.</div></div><div class="caution-item"><div class="cp">Page 06</div><div>Do not rank the five national shares; their counting bases are incompatible.</div></div><div class="caution-item"><div class="cp">Page 08</div><div>BWP 2026 figures are scenarios; H1 actuals do not guarantee the full-year result.</div></div><div class="caution-item"><div class="cp">Page 11</div><div>No comparable French H1 2026 air/water unit total was verified; the hydronic chart ends at FY2025.</div></div><div class="caution-item"><div class="cp">Page 13</div><div>SPIUG changed the HP definition between vintages; use the newest broad series consistently.</div></div><div class="caution-item"><div class="cp">Page 14</div><div>SPIUG and PORT PC may diverge because product scopes and market bases differ.</div></div><div class="caution-item"><div class="cp">Page 15</div><div>Italy has no defensible national HP share; boiler, broad-HP and hydronic indicators use different scopes.</div></div><div class="caution-item"><div class="cp">All pages</div><div>No complete annual boiler installation census was found; sales and installations remain separate concepts.</div></div></div></div>`;
default:return '';
}}
function marketCard(code,main,mid,bottom){let m=MARKETS[code];return `<div class="card market-card" style="--m:${m.accent}"><img class="headerCountryIcon" src="${ASSET[code.toLowerCase()]}" alt="${m.name[lang]}"><div class="country">${m.name[lang]}</div><div class="metric">${main}</div><div class="sub">${mid}</div><div class="share">${bottom}</div></div>`}
function watchCard(code,text){let m=MARKETS[code];return `<div class="card market-card" style="--m:${m.accent};padding:14px"><img class="headerCountryIcon" src="${ASSET[code.toLowerCase()]}" alt="${m.name[lang]}"><div class="country">${m.name[lang]}</div><div class="sub">${esc(text)}</div></div>`}
function buildPages(){let b=$('#book');b.innerHTML=PAGES.map((p,i)=>{let locked=MODE==='preview' && i>=LOCK_AFTER;let content=locked?placeholderLocked(p):renderContent(p);return pageShell(p,i,content,locked)}).join('');renderCharts();updatePage(false);let tx=I18N[lang];$('#editionLabel').textContent=(MODE==='preview'?tx.preview:tx.full)+' · '+tx.special;$('#prevText').textContent=tx.prev;$('#nextText').textContent=tx.next;}
function barChart(id,labels,values,opts={}){let svg=document.getElementById(id);if(!svg)return;let W=800,H=250,pad={l:48,r:16,t:12,b:34};let max=Math.max(...values)*(opts.headroom||1.12);let innerW=W-pad.l-pad.r, innerH=H-pad.t-pad.b;let gap=innerW/values.length;let bw=Math.max(5,gap*(opts.barWidth||.62));let out=[];for(let g=0;g<=4;g++){let y=pad.t+innerH*g/4;out.push(`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/>`);let v=max*(1-g/4);out.push(`<text class="label" x="${pad.l-8}" y="${y+4}" text-anchor="end">${short(v)}</text>`)}values.forEach((v,i)=>{let x=pad.l+gap*i+(gap-bw)/2;let h=innerH*v/max;let y=pad.t+innerH-h;let color=opts.colors?opts.colors[i%opts.colors.length]:(opts.color||getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#35c6a2');out.push(`<rect class="bar" data-tip="${labels[i]} · ${fmt(v)}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${color}"/>`);if(opts.showAllLabels||labels.length<=8||i%Math.ceil(labels.length/8)===0)out.push(`<text class="label" x="${x+bw/2}" y="${H-12}" text-anchor="middle">${labels[i]}</text>`);});svg.innerHTML=out.join('');wireTips(svg)}
function short(v){if(v>=1000000)return (v/1000000).toFixed(1)+'m';if(v>=1000)return Math.round(v/1000)+'k';return Math.round(v)}
function wireTips(svg){let tt=$('#tooltip');svg.querySelectorAll('.bar').forEach(el=>{el.addEventListener('mousemove',e=>{tt.textContent=el.dataset.tip;tt.style.left=e.clientX+'px';tt.style.top=e.clientY+'px';tt.style.opacity=1});el.addEventListener('mouseleave',()=>tt.style.opacity=0)})}
function millionBarChart(id,labels,values,colors){let svg=document.getElementById(id);if(!svg)return;let W=800,H=250,pad={l:56,r:16,t:18,b:48};let max=3.4e6,innerW=W-pad.l-pad.r,innerH=H-pad.t-pad.b,gap=innerW/values.length,bw=gap*.48,out=[];for(let g=0;g<=4;g++){let y=pad.t+innerH*g/4;let val=max*(1-g/4)/1e6;out.push(`<line class="axis" x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}"/>`);out.push(`<text class="label" x="${pad.l-8}" y="${y+4}" text-anchor="end">${val.toFixed(1)}m</text>`)}values.forEach((v,i)=>{let x=pad.l+gap*i+(gap-bw)/2,h=innerH*v/max,y=pad.t+innerH-h;out.push(`<rect class="bar" data-tip="${labels[i].replace('\n',' ')} · ${(v/1e6).toFixed(2)}m" x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${colors[i]}"/>`);out.push(`<text class="value-label" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${(v/1e6).toFixed(2)}m</text>`);let parts=labels[i].split('\n');out.push(`<text class="label" x="${x+bw/2}" y="${H-24}" text-anchor="middle">${parts[0]}</text>`);if(parts[1])out.push(`<text class="label" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${parts[1]}</text>`)});svg.innerHTML=out.join('');wireTips(svg)}
function renderCharts(){millionBarChart('euChart',['2023\n21 ctry','2024\n19 ctry','2025\n18+3'],[3020000,2310000,2900000],['#7089a6','#93a5b9','#35c6a2']);barChart('deTotal',DATA.de_total.labels,DATA.de_total.values,{color:'#F2B705',barWidth:.7,showAllLabels:true});barChart('deHp',DATA.de_hp.labels,DATA.de_hp.values,{color:'#35c6a2',barWidth:.62});barChart('ukBoiler',DATA.uk_boiler.labels,DATA.uk_boiler.values,{color:'#3156D3'});barChart('ukHp',DATA.uk_hp.labels,DATA.uk_hp.values,{color:'#35c6a2'});barChart('frBoiler',DATA.fr_boiler.labels,DATA.fr_boiler.values,{color:'#0055A4'});barChart('frHp',DATA.fr_hp.labels,DATA.fr_hp.values,{color:'#35c6a2'});barChart('frAir',['2021','2022','2023','2024','2025'],[837087,808206,910420,804404,803661],{color:'#0055A4'});barChart('plHp',DATA.pl_hp.labels,DATA.pl_hp.values,{color:'#D4213D',barWidth:.66,showAllLabels:true});barChart('itBoiler',DATA.it_boiler.labels,DATA.it_boiler.values,{colors:['#8898ab','#D4213D'],barWidth:.45});barChart('itHp',DATA.it_hp.labels,DATA.it_hp.values,{colors:['#8898ab','#008C45'],barWidth:.45})}
function updatePage(animate=true,dir=1){let all=[...document.querySelectorAll('.page')];all.forEach((p,i)=>{p.classList.remove('active','old-left','old-right');if(i===current)p.classList.add('active');else if(i<current)p.classList.add('old-left');else p.classList.add('old-right')});$('#pageCount').textContent=`${current+1} / ${PAGES.length}`;$('#progressFill').style.width=((current+1)/PAGES.length*100)+'%';$('#prevBtn').disabled=current===0;$('#nextBtn').disabled=current===PAGES.length-1;$('#leftZone').classList.toggle('disabled',current===0);$('#rightZone').classList.toggle('disabled',current===PAGES.length-1)}
function go(d){let n=Math.max(0,Math.min(PAGES.length-1,current+d));if(n!==current){current=n;updatePage(true,d)}}
$('#lang').addEventListener('change',e=>{lang=e.target.value;buildPages()});$('#prevBtn').onclick=()=>go(-1);$('#nextBtn').onclick=()=>go(1);$('#leftZone').onclick=()=>go(-1);$('#rightZone').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1)});$('#printBtn').onclick=()=>window.print();$('#fullBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
let touchX=null;document.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(touchX==null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>60)go(dx<0?1:-1);touchX=null},{passive:true});
let hp=new URLSearchParams(location.hash.replace(/^#/,'')).get('page');if(hp){let n=parseInt(hp,10);if(n>=1&&n<=PAGES.length)current=n-1;}buildPages();
</script>
